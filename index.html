<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Marco Vendramin – Acoustic Live Music</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:#fff;
  background:#111;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
}

.page{
  width:100%;
  max-width:560px;
  min-height:100vh;
  padding:24px 16px 20px;
  position:relative;
  display:flex;
  justify-content:center;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.14),rgba(0,0,0,.42)),
    url("background.jpg") 43% center / cover no-repeat;
}

.content{
  width:100%;
  text-align:center;
}

/* Logo centered like in your reference image */
.logo{
  width:min(145px,38vw);
  height:auto;
  display:block;
  margin:0 auto 8px;
}

.subtitle{
  margin-top:2px;
  font-size:10px;
  letter-spacing:3.4px;
  text-transform:uppercase;
  color:#d7bd84;
  opacity:.95;
}

.divider{
  width:28px;
  height:1px;
  background:#d7bd84;
  margin:14px auto 17px;
  opacity:.9;
}

/* Text aligned over the button column */
.message-wrap{
  width:62%;
  margin-left:auto;
  margin-right:4%;
}

.message{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
  line-height:1.28;
  font-style:italic;
  text-shadow:0 2px 8px rgba(0,0,0,.72);
}

.thanks{
  display:block;
  margin-top:3px;
  color:#d7bd84;
}

.heart-top{
  margin:12px 0 15px;
  color:#e6c77d;
  font-size:18px;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}

/* Narrow right-side buttons so the musician remains visible */
.buttons{
  width:62%;
  margin-left:auto;
  margin-right:4%;
  display:grid;
  gap:8px;
}

.button{
  min-height:42px;
  display:grid;
  grid-template-columns:27px 1fr;
  align-items:center;
  column-gap:8px;
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.45);
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  background:rgba(10,10,10,.18);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  font-size:12px;
  line-height:1.15;
  font-weight:500;
  text-align:left;
  text-shadow:0 1px 5px rgba(0,0,0,.68);
}

.button:hover{
  background:rgba(255,255,255,.07);
}

.button.support{
  border-color:#cba64f;
  background:rgba(52,40,12,.22);
}

.button small{
  display:block;
  margin-top:2px;
  font-size:9px;
  font-weight:400;
  color:#d7bd84;
}

.icon{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon svg{
  width:22px;
  height:22px;
  display:block;
}

.phone{
  display:block;
  width:max-content;
  margin:18px auto 0;
  color:rgba(255,255,255,.76);
  text-decoration:none;
  font-size:10px;
  letter-spacing:1px;
  text-shadow:0 1px 5px rgba(0,0,0,.75);
}

.footer{
  margin-top:10px;
  font-size:9px;
  letter-spacing:2px;
  color:#d7bd84;
  opacity:.82;
  text-shadow:0 1px 5px rgba(0,0,0,.75);
}

@media(max-width:420px){
  .page{padding:18px 12px 16px;background-position:43% center}
  .logo{width:128px}
  .message-wrap,.buttons{width:62%;margin-right:3%}
  .message{font-size:17px}
  .button{min-height:40px;font-size:11px;grid-template-columns:25px 1fr;padding:6px 9px}
  .icon svg{width:21px;height:21px}
}

@media(max-height:680px){
  .logo{width:118px}
  .divider{margin:10px auto 12px}
  .heart-top{margin:9px 0 10px}
  .buttons{gap:6px}
  .button{min-height:37px}
  .phone{margin-top:11px}
  .footer{margin-top:7px}
}
</style>
</head>

<body>

          </svg>
        </span>
        <span>Chat with me on WhatsApp</span>
      </a>

      <a class="button" href="mailto:marco_vendramin@hotmail.com">
        <span class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="5" width="19" height="14" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/>
            <path d="M3.5 7l8.5 6.3L20.5 7" fill="none" stroke="#fff" stroke-width="1.8"/>
          </svg>
        </span>
        <span>Send me an Email</span>

    </nav>

    <a class="phone" href="tel:+393491314163">+39 349 1314163</a>
    <div class="footer">marco-music.it</div>
  </div>
</main>
</body>
</html>
