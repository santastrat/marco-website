<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Marco Vendramin – Acoustic Live Music</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:#111}
body{min-height:100vh;display:flex;justify-content:center}
.page{
  width:100%;max-width:560px;min-height:100vh;padding:26px 18px 22px;
  display:flex;align-items:center;justify-content:center;
  background:
    linear-gradient(to bottom,rgba(0,0,0,.18),rgba(0,0,0,.48)),
    url("background.jpg") center/cover no-repeat;
}
.content{width:100%;text-align:center}
.logo{width:min(150px,36vw);height:auto;margin:0 auto 8px;display:block}
.subtitle{font-size:12px;letter-spacing:3.5px;text-transform:uppercase;opacity:.88;margin:0 0 20px}
.message{margin:0 auto 22px;max-width:390px;font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.35;font-style:italic;text-shadow:0 1px 8px rgba(0,0,0,.65)}

.buttons{
  display:grid;
  gap:9px;
  width:76%;
  margin-left:auto;
}

.button{
  min-height:50px;
  display:grid;
  grid-template-columns:26px 1fr;
  align-items:center;
  column-gap:10px;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.32);
  border-radius:14px;
  color:#fff;
  text-decoration:none;
  background:rgba(8,8,8,.18);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  font-size:15px;
  font-weight:500;
  text-align:left;
  text-shadow:0 1px 6px rgba(0,0,0,.55);
}

.button:hover{background:rgba(255,255,255,.08)}
.icon{
  width:20px;
  font-size:15px;
  line-height:1;
  text-align:center;
  opacity:.95;
}
.support{
  border-color:rgba(235,199,126,.72);
  background:rgba(30,24,10,.18);
}
.support small{font-size:10px;opacity:.72;margin-left:3px;font-weight:400}

.phone{
  display:block;
  width:max-content;
  margin:18px auto 0;
  color:rgba(255,255,255,.82);
  text-decoration:none;
  font-size:12px;
  letter-spacing:1.2px;
  text-shadow:0 1px 6px rgba(0,0,0,.7)
}
.footer{margin-top:11px;font-size:10px;letter-spacing:2px;opacity:.55;text-shadow:0 1px 6px rgba(0,0,0,.7)}

@media(max-width:420px){
  .buttons{width:78%}
  .button{font-size:14px;min-height:48px;padding:9px 12px;grid-template-columns:22px 1fr;column-gap:8px}
  .icon{font-size:14px}
  .message{font-size:19px}
}

@media(max-height:700px){
  .page{padding-top:18px;padding-bottom:16px}
  .subtitle{margin-bottom:14px}
  .message{margin-bottom:16px}
  .buttons{gap:7px}
  .button{min-height:45px}
  .phone{margin-top:13px}
}
</style>
</head>
<body>
<main class="page">
  <div class="content">
    <img class="logo" src="logo.png" alt="Marco Vendramin">
    <div class="subtitle">Acoustic Live Music</div>

    <p class="message">Enjoyed the music?<br>Thank you for being here.</p>

    <nav class="buttons">
      <a class="button" href="INSTAGRAM_LINK_PLACEHOLDER" target="_blank" rel="noopener">
        <span class="icon">◎</span><span>Follow me on Instagram</span>
      </a>

      <a class="button" href="FACEBOOK_LINK_PLACEHOLDER" target="_blank" rel="noopener">
        <span class="icon">f</span><span>Follow me on Facebook</span>
      </a>

      <a class="button support" href="PAYPAL_LINK_PLACEHOLDER" target="_blank" rel="noopener">
        <span class="icon">♥</span><span>Support my music <small>via PayPal</small></span>
      </a>

      <a class="button" href="https://wa.me/393491314163" target="_blank" rel="noopener">
        <span class="icon">◌</span><span>Chat with me on WhatsApp</span>
      </a>

      <a class="button" href="mailto:EMAIL_LINK_PLACEHOLDER">
        <span class="icon">✉</span><span>Send me an Email</span>
      </a>
    </nav>

    <a class="phone" href="tel:+393491314163">+39 349 1314163</a>
    <div class="footer">marco-music.it</div>
  </div>
</main>
</body>
</html>
