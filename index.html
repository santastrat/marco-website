*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:#111}
body{min-height:100vh;display:flex;justify-content:center}
.page{width:100%;max-width:560px;min-height:100vh;padding:34px 22px 28px;position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;background-image:linear-gradient(to bottom,rgba(0,0,0,.30),rgba(0,0,0,.72)),url("background.jpg");background-position:center;background-size:cover}

.logo{width:min(170px,42vw);height:auto;margin:0 auto 10px;display:block}
.subtitle{font-size:13px;letter-spacing:3px;text-transform:uppercase;opacity:.78;margin:0 0 27px}
.message{margin:0 auto 25px;max-width:390px;font-family:Georgia,"Times New Roman",serif;font-size:21px;line-height:1.38;font-style:italic}
.buttons{display:grid;gap:10px;width:100%}
.button{min-height:54px;display:flex;align-items:center;justify-content:center;gap:11px;padding:13px 17px;border:1px solid rgba(255,255,255,.34);border-radius:14px;color:#fff;text-decoration:none;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:15.5px;font-weight:500;transition:transform .18s ease,background .18s ease}
.button:hover{transform:translateY(-1px);background:rgba(255,255,255,.12)}
.icon{width:23px;text-align:center;font-size:18px}
.support{border-color:rgba(235,199,126,.72);background:rgba(0,0,0,.30)}
.support small{font-size:11px;opacity:.72;margin-left:2px;font-weight:400}
.phone{display:block;margin-top:22px;color:rgba(255,255,255,.72);text-decoration:none;font-size:13px;letter-spacing:1px}
.footer{margin-top:15px;font-size:10px;letter-spacing:2px;opacity:.45}
@media(max-height:720px){.page{padding-top:20px;padding-bottom:18px}.subtitle{margin-bottom:18px}.message{margin-bottom:18px}.button{min-height:48px}.phone{margin-top:15px}}
