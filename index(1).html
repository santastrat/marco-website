<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Marco Vendramin – Acoustic Live Music</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:#fff;background:#0c0d09;
}
body{min-height:100vh;display:flex;justify-content:center}

.page{
  width:100%;max-width:560px;min-height:100vh;
  padding:22px 14px 24px;
  display:flex;justify-content:center;
  background:
    linear-gradient(90deg,rgba(0,0,0,.03) 0%,rgba(0,0,0,.10) 38%,rgba(5,7,4,.42) 61%,rgba(5,7,4,.72) 100%),
    linear-gradient(to bottom,rgba(0,0,0,.10),rgba(0,0,0,.28)),
    url("background.jpg") 37% center/cover no-repeat;
}

.content{width:100%;text-align:center}

/* Larger logo; black logo background blends into the dark photo */
.logo{
  width:min(270px,68vw);
  height:auto;
  display:block;
  margin:0 auto 8px;
  mix-blend-mode:screen;
  filter:sepia(.32) saturate(.72) brightness(1.08);
  opacity:.96;
}

.subtitle{
  margin:5px 0 0;
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:#d7b25e;
  text-shadow:0 1px 6px rgba(0,0,0,.7);
}
.subtitle:after{
  content:"";
  display:block;
  width:38px;height:1px;
  margin:14px auto 18px;
  background:#d7b25e;
}

.message-wrap{
  width:61%;
  margin-left:auto;
  margin-right:2%;
}
.message{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
  line-height:1.28;
  font-style:normal;
  text-shadow:0 2px 9px rgba(0,0,0,.82);
}
.message br + *{}
.message::first-line{font-size:23px}
.heart-top{
  margin:11px 0 15px;
  color:#e1b95f;
  font-size:22px;
  text-shadow:0 2px 7px rgba(0,0,0,.65);
}

/* Buttons on right, leaving musician clearly visible */
.buttons{
  width:61%;
  margin-left:auto;
  margin-right:2%;
  display:grid;
  gap:8px;
}
.button{
  min-height:48px;
  display:grid;
  grid-template-columns:31px 1fr;
  align-items:center;
  column-gap:9px;
  padding:7px 12px;
  border:1px solid rgba(215,178,94,.82);
  border-radius:12px;
  color:#fff;text-decoration:none;
  background:rgba(6,8,5,.36);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  font-size:12.5px;
  line-height:1.18;
  font-weight:500;
  text-align:left;
  text-shadow:0 1px 6px rgba(0,0,0,.72);
}
.button:hover{background:rgba(20,22,15,.48)}
.icon{
  width:27px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:18px;
}
.support{
  background:rgba(41,32,12,.38);
  border-color:#d7aa42;
}
.support small{
  display:block;
  margin-top:3px;
  font-size:10px;
  color:#d9b25d;
  font-weight:400;
}

.phone{
  display:block;
  width:max-content;
  margin:20px auto 0;
  color:#d9b25d;
  text-decoration:none;
  font-size:11px;
  letter-spacing:2px;
  text-shadow:0 1px 7px rgba(0,0,0,.75);
}
.footer{
  margin-top:10px;
  color:#d9b25d;
  font-size:10px;
  letter-spacing:2.4px;
  opacity:.95;
  text-shadow:0 1px 7px rgba(0,0,0,.75);
}

@media(max-width:420px){
  .page{
    padding:17px 10px 18px;
    background-position:34% center;
  }
  .logo{width:min(240px,66vw)}
  .subtitle{font-size:9px;letter-spacing:3.2px}
  .message-wrap,.buttons{width:62%;margin-right:1%}
  .message{font-size:17px}
  .message::first-line{font-size:19px}
  .button{
    min-height:43px;
    grid-template-columns:27px 1fr;
    column-gap:7px;
    padding:6px 9px;
    font-size:11px;
  }
  .icon{width:24px;font-size:16px}
}

@media(max-height:720px){
  .logo{width:205px}
  .subtitle:after{margin:9px auto 11px}
  .heart-top{margin:8px 0 10px}
  .buttons{gap:6px}
  .button{min-height:40px}
  .phone{margin-top:12px}
}
</style>
</head>

<body>

          </svg>
        </span>
        <span>Chat with me on WhatsApp</span>
      </a>

      <a class="button" href="mailto:marco_vendramin@hotmail.com">
        <span class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="5" width="19" height="14" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/>

    </nav>

  </div>
</main>
</body>
</html>
