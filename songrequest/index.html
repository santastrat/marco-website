<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c0d09">
  <meta name="description" content="Choose a song from Marco Vendramin's acoustic live music repertoire.">
  <title>Song Request · Marco Vendramin</title>
  <link rel="stylesheet" href="./styles.css?v=20261125-fix3">
  <script defer src="./config.js?v=20261125-live1"></script><script defer src="./app.js?v=20261125-fix3"></script>
</head>
<body>
  <main class="shell">
    <a class="backlink" href="../">← marco-music.it</a>
    <header class="masthead">
      <img class="logo" src="../logo.png" alt="Marco Vendramin" />
      <p class="tagline">Acoustic Live Music</p>
      <h1 class="heading" id="heading">Song Request</h1>
      <p class="intro" id="intro">Find a favorite from my repertoire and send a song request.</p>
    </header>
    <aside class="tip-row" aria-label="Support my music">
      <span id="tip-copy">Enjoying the music?</span>
      <a id="paypal-link" href="https://paypal.me/VendraminMarco?locale.x=it_IT&amp;country.x=IT" target="_blank" rel="noopener noreferrer"><span id="tip-action">Tip welcome</span></a>
    </aside>
    <section class="search-card" aria-label="Search songs">
      <label class="search-label" for="search" id="search-label">Find your song</label>
      <input class="search-input" id="search" type="search" inputmode="search" autocomplete="off" placeholder="Search by song or artist…">
      <div class="search-meta"><span id="count">Loading songs…</span><span class="state"><span class="dot" id="status-dot"></span><span id="status">Checking requests…</span></span></div>
    </section>
    <div id="notice" class="notice" hidden role="status"></div>
    <ul id="songs" class="songlist" aria-live="polite"></ul>
    <p class="fineprint" id="disclaimer">Requests depend on the live set and cannot always be played.</p>
    <p class="fineprint"><a href="./privacy.html">Privacy</a> · <a href="../">marco-music.it</a></p>
  </main>
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-card">
      <h2 class="modal-title" id="modal-heading">Request this song?</h2>
      <div id="modal-song" class="modal-song"></div><div id="modal-artist" class="modal-artist"></div>
      <div class="modal-actions"><button class="action secondary" type="button" id="cancel">Cancel</button><button class="action primary" type="button" id="send">Send request</button></div>
    </div>
  </div>
</body>
</html>
